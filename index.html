<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prep-Truth — the prep-time numbers your kitchen actually runs on</title>
    <meta
      name="description"
      content="Upload your restaurant's order history and get the prep-time settings you should have set. Deterministic, reproducible, no guessing."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e4572e'/%3E%3Cpath d='M9 22V10h5.2c2.6 0 4.3 1.6 4.3 4s-1.7 4-4.3 4H12v4H9zm3-6.5h2c1 0 1.6-.6 1.6-1.5s-.6-1.5-1.6-1.5h-2v3z' fill='white'/%3E%3Crect x='20' y='20' width='4' height='2.6' fill='white'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("prep-truth-theme")
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches
          if (dark) document.documentElement.classList.add("dark")
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
